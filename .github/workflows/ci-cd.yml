---
# CI/CD workflow for types
# Automatically publishes to NPM when NPM_TOKEN is configured

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write      # For creating GitHub releases
  id-token: write      # For NPM provenance
  deployments: write   # For deployment tracking
  packages: write      # For publishing to GitHub Packages (publish-target: github)

jobs:
  cicd:
    uses: Sudobility/workflows/.github/workflows/unified-cicd.yml@main
    secrets: inherit
    with:
      publish-target: github   # publish @sudobility/types to GitHub Packages
